<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITSM · Protótipo de atendimento</title>
<style>
:root{--ink:#18273d;--muted:#65748b;--blue:#245ee6;--line:#e3e9f1;--bg:#f4f6fa;--green:#137660}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--blue)}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{background:#112239;color:#ced7e5;padding:30px 20px;display:flex;flex-direction:column;gap:26px}.brand{font-size:22px;font-weight:750;color:white;letter-spacing:-.7px}.brand span{background:#3576f6;padding:3px 9px;border-radius:9px;margin-right:9px}.small{font-size:12px;color:var(--muted)}aside .small{color:#96a9c2}nav{display:grid;gap:6px}nav button{text-align:left;border:0;background:transparent;color:#c4d0e1;padding:12px 14px;border-radius:8px}nav button.active{color:white;background:#28496f}nav button:hover{background:#203b5d}.asidefoot{margin-top:auto;font-size:12px;color:#98adc6}.workspace{min-width:0}header{background:white;border-bottom:1px solid var(--line);padding:17px 36px;display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;align-items:center;gap:10px}.avatar{background:#e9efff;color:#345dc2;border-radius:50%;padding:8px 11px;font-weight:700}.demo{padding:9px 36px;background:#fff4d9;color:#7a5915;font-size:12px}main{max-width:1400px;margin:auto;padding:30px 36px}h1{font-size:29px;letter-spacing:-1px;margin:3px 0 5px}h2{font-size:17px;margin:0 0 15px}p{margin:5px 0 15px}.muted{color:var(--muted)}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.6px;color:var(--blue)}.btn{background:white;border:1px solid #d6dfeb;border-radius:7px;padding:9px 15px;color:var(--ink);font-weight:600}.primary{background:var(--blue);color:white;border-color:var(--blue)}.danger{color:#a54139}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 3px 10px #172b4403}.stat strong{font-size:29px;display:block;margin:9px 0}.stat .label{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:20px}.hero{border-radius:14px;padding:30px;background:#173b69;color:white;display:flex;align-items:center;justify-content:space-between;gap:25px}.hero h2{font-size:25px;margin-bottom:8px}.hero p{color:#cedbef;max-width:540px}.hero .btn{white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,textarea,select{border:1px solid #d6dfeb;background:white;border-radius:7px;padding:10px;color:var(--ink);max-width:100%}textarea{resize:vertical;width:100%}input{width:100%}.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:#f8fafc}th,td{padding:13px 12px;border-bottom:1px solid #edf0f5}td.title{white-space:normal;min-width:210px}.link{border:0;background:transparent;color:var(--blue);padding:0;text-align:left;font-weight:600}.badge{display:inline-block;font-size:11px;font-weight:650;padding:4px 9px;border-radius:5px;background:#edf1f7;color:#52627a}.open{background:#eaf0ff;color:#345ccc}.working{background:#e8f4ff;color:#146295}.waiting{background:#fff1d5;color:#8f640d}.closed{background:#e3f5ed;color:#16714e}.high{color:#b34b42}.medium{color:#946719}.low{color:#42706c}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:19px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:650}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0}.divider{border-top:1px solid var(--line);margin:20px 0}.bubble{background:#f7f9fc;border-radius:9px;padding:16px;margin:12px 0}.internal{background:#fff6df;border:1px solid #f2dfac}.bubble p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.tabs{display:flex;gap:9px;margin:20px 0 12px}.tabs button[aria-pressed=true]{background:#e9efff;border-color:#9fb8f5;color:#204ec6}.article{padding:14px 0;border-bottom:1px solid var(--line)}.article summary{cursor:pointer;font-weight:600}.article p{padding-top:12px;color:var(--muted)}.barrow{display:grid;grid-template-columns:115px 1fr 24px;gap:12px;align-items:center;margin:20px 0;font-size:12px}.track{background:#edf1f8;border-radius:5px;height:13px}.bar{height:13px;background:#4d79e9;border-radius:5px}.notice{background:#eef4ff;border-radius:7px;padding:12px;color:#3b5686;font-size:12px}.timeline{padding-left:18px;color:var(--muted)}.timeline li{margin:9px 0}.empty{padding:25px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:22px;right:22px;background:#183a30;color:white;border-radius:9px;padding:14px 20px;max-width:85vw;z-index:5}#toast:empty{display:none}footer{color:var(--muted);font-size:11px;padding-top:25px}.subtle{font-size:12px}.count{font-size:12px;background:#eef3ff;padding:4px 9px;border-radius:15px}.metricsnote{font-size:12px;color:var(--muted)}
@media(max-width:1000px){.shell{grid-template-columns:190px 1fr}main{padding:24px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header,.demo{padding-left:24px;padding-right:24px}}
@media(max-width:650px){.shell{display:block}aside{padding:14px;gap:10px}.brand{font-size:18px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.asidefoot,aside>.small{display:none}header{padding:12px;flex-wrap:wrap}main{padding:18px 12px}.demo{padding:8px 12px}.hero{display:block;padding:22px}.hero button{margin-top:8px}.pagehead{align-items:flex-start}h1{font-size:24px}.formgrid{grid-template-columns:1fr}.card{padding:16px}.cards{gap:10px}.identity{font-size:12px}}
</style></head>
<body><div class="shell"><aside><div class="brand"><span>i</span>ITSM</div><div class="small">CENTRAL DE SERVIÇOS</div><nav id="nav" aria-label="Navegação principal"></nav><div class="asidefoot">TI · Sistemas · Audiovisual<br><br>Protótipo de experiência · v0.1<br>Sem conexão com produção</div></aside><div class="workspace"><header><div class="muted">Ambiente de demonstração</div><div class="identity"><label for="profile" class="small">Simular perfil</label><select id="profile"><option value="user">Colaborador</option><option value="tech">Técnico</option><option value="manager">Gestor de área</option><option value="admin">Gestor de TI</option></select><span class="avatar" id="avatar">MC</span><span id="person"></span></div></header><div class="demo">DEMONSTRAÇÃO · Dados fictícios em memória. SSO, permissões de servidor, e-mail, anexos e SLA real não estão implementados. Recarregar restaura os dados.</div><main id="app"></main></div></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const people={user:{name:'Marina Costa',area:'Financeiro'},tech:{name:'Rafael Lima',area:'Tecnologia'},manager:{name:'Helena Alves',area:'Financeiro'},admin:{name:'Gestor de TI',area:'Tecnologia'}};
const categories={'Sistemas de negócio':'Sistemas','Contas e acessos':'Operações de TI','Computadores e periféricos':'Operações de TI','Rede e conectividade':'Operações de TI','Audiovisual':'Audiovisual'};
const seeds=[
[1048,'Não consigo acessar o portal financeiro','Marina Costa','Financeiro','Unidade 1','Sistemas de negócio','Em atendimento','Média','Rafael Lima'],
[1047,'Notebook não reconhece o monitor externo','Marina Costa','Financeiro','Unidade 1','Computadores e periféricos','Aguardando solicitante','Baixa','Rafael Lima'],
[1046,'Solicitação de acesso ao ERP','João Melo','Financeiro','Unidade 2','Contas e acessos','Aberto','Baixa',null],
[1045,'Projetor da sala 3 sem imagem','Lia Rocha','Comunicação','Unidade 3','Audiovisual','Aberto','Média',null],
[1044,'Conexão instável no andar administrativo','Pedro Dias','Operações','Unidade 2','Rede e conectividade','Em atendimento','Alta','Beatriz Souza'],
[1043,'Dúvida sobre relatório de despesas','Marina Costa','Financeiro','Unidade 1','Sistemas de negócio','Encerrado','Baixa','Rafael Lima'],
[1042,'Microfone com ruído durante apresentação','Lia Rocha','Comunicação','Unidade 3','Audiovisual','Em atendimento','Baixa','Caio Martins'],
[1041,'Permissão de acesso à pasta compartilhada','João Melo','Financeiro','Unidade 2','Contas e acessos','Encerrado','Baixa','Beatriz Souza']
];
let tickets=seeds.map((s,i)=>({id:s[0],title:s[1],owner:s[2],area:s[3],unit:s[4],category:s[5],group:categories[s[5]],status:s[6],severity:s[7],assignee:s[8],description:'Preciso de apoio para esta solicitação. As informações e os nomes desta demonstração são fictícios.',openedBy:s[2],cycle:1,reopens:0,closures:s[6]==='Encerrado'?1:0,messages:s[6]==='Aguardando solicitante'?[{author:'Rafael Lima',text:'Você pode informar o modelo da conexão utilizada?',internal:false}]:[],history:['Chamado registrado no portal','Encaminhado para '+categories[s[5]]]}));
let role='user',page='home',selected=1048,mode='public',filter='',query='',dashGroup='',dashArea='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const technical=()=>role==='tech'||role==='admin';
function visible(){return tickets.filter(t=>role==='user'?t.owner===people.user.name:role==='manager'?t.area===people.manager.area:role==='tech'?['Sistemas','Operações de TI'].includes(t.group):true)}
function badge(s){return '<span class="badge '+({'Aberto':'open','Em atendimento':'working','Aguardando solicitante':'waiting','Encerrado':'closed'}[s]||'')+'">'+esc(s)+'</span>'}
function toast(s){$('#toast').textContent=s;setTimeout(()=>$('#toast').textContent='',4500)}
function go(p,id){page=p;if(id)selected=Number(id);mode='public';render();window.scrollTo(0,0)}
function btn(text,action,arg='',cls=''){return '<button class="btn '+cls+'" data-action="'+action+'" data-arg="'+esc(arg)+'">'+text+'</button>'}
function heading(k,title,desc,action=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div>'+action+'</div>'}
function table(data){return '<div class="tablewrap"><table><thead><tr><th>Chamado</th><th>Solicitação</th><th>Situação</th><th>Severidade</th><th>Responsável</th></tr></thead><tbody>'+data.map(t=>'<tr><td><button class="link" data-action="detail" data-arg="'+t.id+'">#'+t.id+'</button></td><td class="title"><button class="link" data-action="detail" data-arg="'+t.id+'">'+esc(t.title)+'</button><div class="small">'+esc(t.group)+' · '+esc(t.unit)+'</div></td><td>'+badge(t.status)+'</td><td class="'+({Alta:'high',Média:'medium',Baixa:'low'}[t.severity])+'">'+t.severity+'</td><td>'+esc(t.assignee||'Não atribuído')+'</td></tr>').join('')+'</tbody></table>'+(data.length?'':'<div class="empty">Nenhum chamado encontrado neste filtro.</div>')+'</div>'}
function stats(data){const values=[['Chamados no recorte',data.length],['Em aberto',data.filter(t=>t.status!=='Encerrado').length],['Aguardando retorno',data.filter(t=>t.status==='Aguardando solicitante').length],['Encerrados agora',data.filter(t=>t.status==='Encerrado').length]];return '<div class="cards">'+values.map(([l,n])=>'<div class="card stat"><span class="label">'+l+'</span><strong>'+n+'</strong><span class="small">Situação atual · dados de exemplo</span></div>').join('')+'</div>'}
function home(){const data=visible().filter(t=>t.owner===people[role].name);return heading('Meu atendimento','Olá, '+esc(people[role].name.split(' ')[0])+'.','Como podemos ajudar hoje?')+'<section class="hero"><div><h2>Seu suporte, em um só lugar.</h2><p>Conte o que aconteceu e acompanhe cada etapa do atendimento da sua solicitação.</p></div>'+btn('＋ Abrir chamado','go','new','primary')+'</section>'+stats(data)+'<div class="grid"><section class="card"><div class="row"><h2>Meus chamados recentes</h2>'+btn('Ver todos','go','mine')+'</div>'+table(data)+'</section><section class="card"><div class="eyebrow">Antes de abrir</div><h2>Orientações rápidas</h2><details class="article"><summary>Como descrever uma solicitação?</summary><p>Informe o problema, quando começou e qual atividade está sendo afetada. Não inclua senhas.</p></details><details class="article"><summary>Onde acompanho o atendimento?</summary><p>Abra Meus chamados e selecione o número da solicitação para consultar a conversa.</p></details><div class="divider"></div><p class="small">Conteúdo demonstrativo. A gestão completa de artigos pertence a uma próxima entrega.</p></section></div>'}
function newTicket(){return heading('Portal de serviços','Abrir chamado','Descreva sua necessidade. Nós encaminhamos ao grupo responsável.')+'<form id="newform" class="card"><div class="notice">Abertura para si nesta demonstração. A abertura delegada pelo gestor será detalhada após validação da regra de área.</div><div class="divider"></div><div class="formgrid"><div class="field"><label>Solicitante</label><input value="'+esc(people[role].name)+'" readonly></div><div class="field"><label>Área</label><input value="'+esc(people[role].area)+'" readonly></div><div class="field"><label for="type">O que você precisa?</label><select id="type" name="type"><option>Estou com um problema</option><option>Preciso solicitar algo</option></select></div><div class="field"><label for="cat">Categoria</label><select id="cat" name="category" required><option value="">Selecione uma categoria</option>'+Object.keys(categories).map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field wide"><label for="title">Título</label><input id="title" name="title" required maxlength="150" placeholder="Ex.: não consigo acessar o ERP"></div><div class="field wide"><label for="description">Descrição</label><textarea id="description" name="description" required rows="5" maxlength="4000" placeholder="O que aconteceu? Qual atividade está sendo afetada?"></textarea></div><div class="field"><label for="unit">Unidade do atendimento</label><select id="unit" name="unit"><option>Unidade 1</option><option>Unidade 2</option><option>Unidade 3</option></select></div><div class="field"><label for="impact">Quem está sendo afetado?</label><select id="impact" name="impact"><option value="Baixa">Somente eu</option><option value="Média">Toda a minha área</option><option value="Alta">Toda a unidade</option></select></div></div><p class="small" style="margin-top:15px">A relação impacto/severidade é ilustrativa. Anexos e notificações externas não são enviados neste protótipo.</p><div class="actions">'+btn('Cancelar','go','home')+'<button class="btn primary" type="submit">Enviar chamado →</button></div></form>'}
function list(){let data=visible();if(page==='mine')data=data.filter(t=>t.owner===people[role].name);if(filter==='Sem responsável')data=data.filter(t=>!t.assignee&&t.status!=='Encerrado');else if(filter)data=data.filter(t=>t.status===filter);if(query)data=data.filter(t=>(t.id+' '+t.title+' '+t.owner).toLowerCase().includes(query.toLowerCase()));return heading('Atendimento',page==='mine'?'Meus chamados':'Fila de atendimento',page==='mine'?'Acompanhe suas solicitações e converse com a equipe.':'Escolha um chamado e assuma o atendimento.',btn('＋ Novo chamado','go','new','primary'))+'<section class="card"><div class="toolbar"><input id="search" aria-label="Buscar chamados" placeholder="Buscar por número, título ou solicitante" value="'+esc(query)+'"><select id="status" aria-label="Filtrar situação">'+['','Sem responsável','Aberto','Em atendimento','Aguardando solicitante','Encerrado'].map(s=>'<option '+(s===filter?'selected':'')+' value="'+s+'">'+(s||'Todas as situações')+'</option>').join('')+'</select>'+btn('Aplicar','search')+'</div>'+table(data)+'</section>'}
function detail(){const t=visible().find(t=>t.id===selected);if(!t)return '<section class="card"><h1>Chamado indisponível</h1><p>Este chamado não está disponível no perfil selecionado.</p></section>';const mine=t.owner===people[role].name,canWork=technical()&&(role==='admin'||t.assignee===people.tech.name),canRespond=t.status!=='Encerrado'&&(mine||canWork);let actions='';
if(technical()&&!t.assignee&&t.status==='Aberto')actions+=btn('Assumir chamado','assume',t.id,'primary');
if(canWork&&t.status!=='Encerrado')actions+=btn('Resolver e encerrar','close',t.id,'primary');
if(mine&&t.status==='Encerrado')actions+=btn('Reabrir chamado','reopen',t.id,'primary');
return heading('Chamado #'+t.id,esc(t.title),esc(t.owner)+' · '+esc(t.unit),actions)+'<div class="grid"><section class="card"><div class="row"><h2>Conversa do atendimento</h2>'+badge(t.status)+'</div><div class="bubble"><strong>'+esc(t.owner)+'</strong><span class="small"> · Solicitação inicial</span><p>'+esc(t.description)+'</p></div>'+t.messages.filter(m=>!m.internal||technical()).map(m=>'<div class="bubble '+(m.internal?'internal':'')+'"><strong>'+esc(m.author)+'</strong><span class="small"> · '+(m.internal?'Nota interna':'Resposta pública')+'</span><p>'+esc(m.text)+'</p></div>').join('')+(canRespond?'<div class="tabs">'+(canWork?'<button class="btn" data-action="mode" data-arg="public" aria-pressed="'+(mode==='public')+'">Resposta pública</button><button class="btn" data-action="mode" data-arg="internal" aria-pressed="'+(mode==='internal')+'">Nota interna</button>':'')+'</div><form id="replyform"><label for="reply" class="small">'+(mode==='internal'?'Visível somente à equipe técnica nesta simulação':'Visível ao solicitante e à equipe')+'</label><textarea id="reply" required maxlength="4000" rows="4" placeholder="Escreva sua mensagem"></textarea><div class="actions">'+(canWork&&t.status==='Em atendimento'&&mode==='public'?btn('Solicitar informação','wait',t.id):'')+'<button class="btn primary" type="submit">Enviar mensagem</button></div></form>':'<div class="notice">'+(t.status==='Encerrado'?'Atendimento encerrado. A solução permanece no histórico.':'Visualização de leitura neste perfil.')+'</div>')+'</section><section><div class="card"><h2>Dados do atendimento</h2>'+[['Grupo',t.group],['Responsável',t.assignee||'Não atribuído'],['Categoria',t.category],['Área',t.area],['Severidade',t.severity],['Ciclo',t.cycle],['SLA','Não configurado']].map(([l,v])=>'<div class="row"><span class="small">'+l+'</span><strong class="subtle">'+esc(v)+'</strong></div>').join('')+(t.status==='Aguardando solicitante'?'<div class="notice">Pausa representada visualmente. Não há cronômetro de SLA implementado.</div>':'')+'</div><div class="card" style="margin-top:20px"><h2>Histórico</h2><ol class="timeline">'+t.history.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ol></div></section></div>'}
function dashboard(){if(role!=='manager'&&role!=='admin')return '<p>Acesso indisponível neste perfil.</p>';const data=visible().filter(t=>(!dashGroup||t.group===dashGroup)&&(!dashArea||t.area===dashArea));const groups=['Sistemas','Operações de TI','Audiovisual'];return heading('Gestão e indicadores',role==='manager'?'Visão da minha área':'Panorama do atendimento','Dados consistentes com os chamados desta sessão — sem indicadores de SLA fictícios.')+'<div class="toolbar"><select id="dashgroup" aria-label="Filtrar grupo"><option value="">Todos os grupos</option>'+groups.map(g=>'<option '+(g===dashGroup?'selected':'')+'>'+g+'</option>').join('')+'</select>'+(role==='admin'?'<select id="dasharea" aria-label="Filtrar área"><option value="">Todas as áreas</option>'+[...new Set(tickets.map(t=>t.area))].map(a=>'<option '+(a===dashArea?'selected':'')+'>'+a+'</option>').join('')+'</select>':'<span class="badge">Área: Financeiro</span>')+btn('Aplicar filtros','dashfilter')+'</div>'+stats(data)+'<div class="grid"><section class="card"><h2>Demanda por grupo</h2><p class="small">Quantidade de chamados no recorte atual</p>'+groups.map(g=>{const n=data.filter(t=>t.group===g).length;return '<div class="barrow"><span>'+g+'</span><div class="track" aria-hidden="true"><div class="bar" style="width:'+(data.length?n/data.length*100:0)+'%"></div></div><strong>'+n+'</strong></div>'}).join('')+'</section><section class="card"><h2>Continuidade do atendimento</h2><div class="row"><span>Encerramentos realizados</span><strong>'+data.reduce((n,t)=>n+t.closures,0)+'</strong></div><div class="row"><span>Reaberturas registradas</span><strong>'+data.reduce((n,t)=>n+t.reopens,0)+'</strong></div><div class="row"><span>Sem responsável</span><strong>'+data.filter(t=>!t.assignee&&t.status!=='Encerrado').length+'</strong></div><div class="divider"></div><p class="metricsnote">Encerrar duas vezes o mesmo chamado soma dois encerramentos, mas mantém um único chamado. SLA e séries históricas serão implementados após validação das regras.</p></section></div><section class="card" style="margin-top:20px"><h2>Chamados que compõem os indicadores <span class="count">'+data.length+'</span></h2>'+table(data)+'</section>'}
function render(){const links=[['home','⌂  Início'],['new','＋  Abrir chamado'],['mine','▤  Meus chamados']];if(technical())links.push(['queue','☷  Fila de atendimento']);if(role==='manager'||role==='admin')links.push(['dashboard','▥  Dashboard']);$('#nav').innerHTML=links.map(([p,l])=>'<button data-action="go" data-arg="'+p+'" class="'+(page===p?'active':'')+'" '+(page===p?'aria-current="page"':'')+'>'+l+'</button>').join('');$('#person').textContent=people[role].name;$('#avatar').textContent=people[role].name.split(' ').slice(0,2).map(x=>x[0]).join('');$('#app').innerHTML=(page==='home'?home():page==='new'?newTicket():page==='detail'?detail():page==='dashboard'?dashboard():list())+'<footer>Protótipo ITSM · hipóteses de UX para validação · dados apenas nesta sessão</footer>';const nf=$('#newform');if(nf)nf.onsubmit=create;const rf=$('#replyform');if(rf)rf.onsubmit=reply;}
function create(e){e.preventDefault();const f=new FormData(e.target);if(!f.get('title').trim()||!f.get('description').trim()){toast('Preencha título e descrição com conteúdo.');return}const cat=f.get('category'),id=Math.max(...tickets.map(t=>t.id))+1;tickets.unshift({id,title:f.get('title').trim(),description:f.get('description').trim(),type:f.get('type'),owner:people[role].name,openedBy:people[role].name,area:people[role].area,unit:f.get('unit'),category:cat,group:categories[cat],status:'Aberto',severity:f.get('impact'),assignee:null,cycle:1,reopens:0,closures:0,messages:[],history:['Chamado registrado no portal','Encaminhado para '+categories[cat]]});go('detail',id);toast('Chamado #'+id+' criado na demonstração. Nenhum e-mail enviado.')}
function reply(e){e.preventDefault();const t=visible().find(t=>t.id===selected);const text=$('#reply').value.trim();if(!text){toast('Escreva uma mensagem.');return}t.messages.push({author:people[role].name,text,internal:mode==='internal'&&technical()});if(t.owner===people[role].name&&t.status==='Aguardando solicitante'){t.status='Em atendimento';t.history.push('Atendimento retomado após resposta (hipótese do protótipo)')}render();toast('Mensagem registrada nesta sessão.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action,arg=b.dataset.arg;if(a==='go'){filter='';query='';go(arg);return}if(a==='detail'){go('detail',arg);return}if(a==='search'){query=$('#search').value;filter=$('#status').value;render();return}if(a==='dashfilter'){dashGroup=$('#dashgroup').value;dashArea=$('#dasharea')?.value||'';render();return}if(a==='mode'){if($('#reply')?.value&&!confirm('Trocar o tipo de mensagem descarta o texto atual. Continuar?'))return;mode=arg;render();return}const t=visible().find(t=>t.id===Number(arg));if(!t)return;if(a==='assume'&&technical()&&!t.assignee&&t.status==='Aberto'){t.assignee=people[role].name;t.status='Em atendimento';t.history.push('Assumido por '+people[role].name);render();toast('Atendimento assumido.')}if(a==='wait'&&technical()&&t.status==='Em atendimento'){const text=$('#reply').value.trim();if(!text){toast('Escreva a pergunta ao solicitante antes de continuar.');$('#reply').focus();return}t.messages.push({author:people[role].name,text,internal:false});t.status='Aguardando solicitante';t.history.push('Aguardando retorno do solicitante');render();toast('Espera registrada; SLA real não implementado.')}if(a==='close'&&technical()&&t.status!=='Encerrado'){const text=prompt('Registre a solução aplicada (demonstração):');if(!text?.trim())return;t.messages.push({author:people[role].name,text:'Solução: '+text.trim(),internal:false});t.status='Encerrado';t.closures++;t.history.push('Ciclo '+t.cycle+' encerrado por '+people[role].name);render();toast('Chamado encerrado.')}if(a==='reopen'&&t.owner===people[role].name&&t.status==='Encerrado'){const reason=prompt('Por que o atendimento precisa continuar?');if(!reason?.trim())return;t.cycle++;t.reopens++;t.status=t.assignee?'Em atendimento':'Aberto';t.messages.push({author:people[role].name,text:'Reabertura: '+reason.trim(),internal:false});t.history.push('Reaberto · ciclo '+t.cycle);render();toast('Mesmo chamado reaberto; histórico preservado.')}});
$('#profile').onchange=e=>{role=e.target.value;filter='';query='';dashGroup='';dashArea='';page=role==='tech'?'queue':role==='admin'||role==='manager'?'dashboard':'home';render()};
render();
</script></body></html>
